{% extends 'base.html' %}

{% block content %}
<style>
    .timeline {
        max-width: 800px;
        margin: 0 auto;
        position: relative;
    }
    .timeline::before {
        content: '';
        position: absolute;
        top: 0;
        left: 20px;
        height: 100%;
        width: 2px;
        background: linear-gradient(to bottom, var(--accent) 0%, rgba(255, 91, 14, 0.05) 100%);
    }
    .timeline-event {
        position: relative;
        margin-bottom: 32px;
        padding-left: 50px;
        transition: all 0.3s ease;
    }
    .timeline-dot {
        position: absolute;
        left: 11px;
        top: 32px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--bg-dark);
        border: 4px solid var(--accent);
        box-shadow: 0 0 10px var(--accent-glow);
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        z-index: 2;
    }
    .timeline-event:hover .timeline-dot {
        transform: scale(1.3);
        box-shadow: 0 0 15px var(--accent), 0 0 5px rgba(255, 255, 255, 0.5);
    }
    .event-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
        flex-wrap: wrap;
        gap: 8px;
    }
    .status-badge {
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 4px 12px;
        border-radius: 20px;
    }
    .status-upcoming { 
        background: rgba(16, 185, 129, 0.12); 
        color: #10b981; 
        border: 1px solid rgba(16, 185, 129, 0.3);
        box-shadow: 0 0 10px rgba(16, 185, 129, 0.1);
    }
    .status-past { 
        background: rgba(148, 163, 184, 0.08); 
        color: #94a3b8; 
        border: 1px solid rgba(148, 163, 184, 0.15);
    }
</style>

<h2 class="section-title">Timeline of Club Activities</h2>

<div class="timeline">
    {% for event in events %}
    <div class="timeline-event">
        <div class="timeline-dot"></div>
        <div class="glass-card">
            <div class="event-meta">
                <small style="color: var(--accent); font-weight: 600;">{{ event.date }}</small>
                <span class="status-badge {% if event.status == 'Upcoming' %}status-upcoming{% else %}status-past{% endif %}">
                    {{ event.status }}
                </span>
            </div>
            <h3 style="margin: 0 0 12px 0;">{{ event.title }}</h3>
            <p style="color: var(--text-secondary); line-height: 1.6;">{{ event.desc }}</p>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
