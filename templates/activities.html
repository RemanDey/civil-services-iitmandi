{% extends 'base.html' %}

{% block content %}
<style>
    .timeline {
        max-width: 800px;
        margin: 0 auto;
        position: relative;
    }
    .timeline::before {
        content: '';
        position: absolute;
        top: 0;
        left: 20px;
        height: 100%;
        width: 2px;
        background: var(--glass-border);
    }
    .timeline-event {
        position: relative;
        margin-bottom: 32px;
        padding-left: 50px;
    }
    .timeline-dot {
        position: absolute;
        left: 11px;
        top: 28px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--bg-dark);
        border: 4px solid var(--accent);
    }
    .status-badge {
        font-size: 0.75rem;
        font-weight: 700;
        padding: 4px 12px;
        border-radius: 20px;
        float: right;
    }
    .status-upcoming { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981;}
    .status-past { background: rgba(156, 163, 175, 0.2); color: #9ca3af; }
</style>

<h2 class="section-title">Timeline of Club Activities</h2>

<div class="timeline">
    {% for event in events %}
    <div class="timeline-event">
        <div class="timeline-dot"></div>
        <div class="glass-card">
            <span class="status-badge {% if event.status == 'Upcoming' %}status-upcoming{% else %}status-past{% endif %}">
                {{ event.status }}
            </span>
            <small style="color: var(--accent); font-weight: 600;">{{ event.date }}</small>
            <h3 style="margin: 8px 0 12px 0;">{{ event.title }}</h3>
            <p style="color: var(--text-secondary); line-height: 1.6;">{{ event.desc }}</p>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
