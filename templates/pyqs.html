{% extends 'base.html' %}

{% block content %}
<style>
    .filter-wrapper {
        margin-bottom: 30px;
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
    }
    .filter-select {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--glass-border);
        color: #fff;
        padding: 12px 20px;
        border-radius: 10px;
        outline: none;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s ease;
    }
    .filter-select:hover {
        border-color: rgba(255, 91, 14, 0.35);
        background: rgba(255, 91, 14, 0.04);
    }
    .filter-select option {
        background: #0d0d12;
        color: #fff;
        padding: 10px;
    }
    .table-container {
        overflow-x: auto;
        border: 1px solid var(--glass-border);
        border-radius: 16px;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
    }
    th, td {
        padding: 18px 24px;
        border-bottom: 1px solid var(--glass-border);
    }
    th {
        font-weight: 700;
        color: var(--accent);
        background: rgba(255, 91, 14, 0.02);
        letter-spacing: 0.5px;
        text-transform: uppercase;
        font-size: 0.85rem;
        border-bottom: 2px solid rgba(255, 91, 14, 0.2);
    }
    td {
        font-size: 0.95rem;
    }
    tr:hover td { 
        background: rgba(255, 91, 14, 0.02); 
    }
    .download-link {
        color: var(--accent);
        text-decoration: none;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: all 0.25s ease;
    }
    .download-link:hover {
        color: var(--accent-hover);
        transform: translateY(-1px);
        text-shadow: 0 0 10px var(--accent-glow);
    }
</style>

<h2 class="section-title">Past Year Question Vault</h2>

<div class="filter-wrapper">
    <select class="filter-select" id="examFilter" onchange="filterPapers()">
        <option value="All">All Exams</option>
        <option value="UPSC CSE">UPSC CSE</option>
        <option value="UPSC IFoS">UPSC IFoS</option>
    </select>
    <select class="filter-select" id="yearFilter" onchange="filterPapers()">
        <option value="All">All Years</option>
        <option value="2025">2025</option>
        <option value="2024">2024</option>
        <option value="2023">2023</option>
    </select>
</div>

<div class="glass-card table-container">
    <table>
        <thead>
            <tr>
                <th>Year</th>
                <th>Exam Category</th>
                <th>Paper Module Description</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="pyq-table-body">
            {% for paper in papers %}
            <tr class="pyq-row" data-exam="{{ paper.exam }}" data-year="{{ paper.year }}">
                <td style="font-weight: 600;">{{ paper.year }}</td>
                <td><span style="background:var(--glass-focus); padding:4px 8px; border-radius:6px; font-size:0.85rem;">{{ paper.exam }}</span></td>
                <td>{{ paper.paper }}</td>
                <td><a href="{{ paper.link }}" class="download-link"><i class="fa-solid fa-file-arrow-down"></i> Download</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<script>
    function filterPapers() {
        const examVal = document.getElementById("examFilter").value;
        const yearVal = document.getElementById("yearFilter").value;
        const rows = document.querySelectorAll(".pyq-row");

        rows.forEach(row => {
            const matchExam = (examVal === "All" || row.getAttribute("data-exam") === examVal);
            const matchYear = (yearVal === "All" || row.getAttribute("data-year") === yearVal);
            row.style.display = (matchExam && matchYear) ? "" : "none";
        });
    }
</script>
{% endblock %}
