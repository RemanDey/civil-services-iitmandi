{% extends 'base.html' %}

{% block content %}
<style>
    .quiz-box {
        max-width: 650px;
        margin: 0 auto;
    }
    .option-btn {
        display: block;
        width: 100%;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--glass-border);
        padding: 16px 20px;
        border-radius: 12px;
        color: var(--text-primary);
        text-align: left;
        margin-bottom: 14px;
        cursor: pointer;
        font-size: 1rem;
        font-weight: 500;
        transition: all 0.25s cubic-bezier(0.165, 0.84, 0.44, 1);
    }
    .option-btn:hover { 
        background: rgba(255, 91, 14, 0.05); 
        border-color: rgba(255, 91, 14, 0.35);
        transform: translateX(5px);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }
    .option-btn.selected { 
        border-color: var(--accent); 
        background: rgba(255, 91, 14, 0.15); 
        box-shadow: 0 0 20px rgba(255, 91, 14, 0.2), inset 0 0 0 1px var(--accent);
        color: #fff;
        font-weight: 600;
    }
    
    .action-row {
        display: flex;
        justify-content: space-between;
        margin-top: 30px;
    }
    .quiz-nav-btn {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.05);
        padding: 12px 26px;
        border-radius: 10px;
        color: white;
        cursor: pointer;
        font-weight: 700;
        letter-spacing: 0.5px;
        transition: all 0.2s ease;
    }
    .quiz-nav-btn:hover {
        background: rgba(255, 255, 255, 0.15);
        transform: translateY(-2px);
    }
    #submit-btn { 
        background: var(--accent-gradient); 
        border: none;
        box-shadow: 0 4px 15px var(--accent-glow);
    }
    #submit-btn:hover {
        box-shadow: 0 6px 20px rgba(255, 91, 14, 0.45);
        background: linear-gradient(135deg, #ff6c24, #ff9351);
    }

    /* Modal Styling */
    .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(3, 3, 5, 0.9);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        z-index: 3000;
        align-items: center;
        justify-content: center;
    }
    .modal-content {
        width: calc(100% - 32px);
        max-width: 450px;
        text-align: center;
        border-color: rgba(255, 91, 14, 0.25);
    }
</style>

<div class="quiz-box glass-card" id="quiz-card">
    <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
        <span style="color: var(--accent); font-weight: 600;" id="progress-text">Question 1 of 3</span>
    </div>
    <h3 id="question-text" style="margin-bottom: 24px; line-height: 1.4;">Loading Quiz Content Question Block...</h3>
    
    <div id="options-container"></div>

    <div class="action-row">
        <button class="quiz-nav-btn" id="prev-btn" onclick="changeQuestion(-1)">Previous</button>
        <button class="quiz-nav-btn" id="next-btn" onclick="changeQuestion(1)">Next</button>
        <button class="quiz-nav-btn" id="submit-btn" style="display:none;" onclick="evaluateQuiz()">Submit Quiz</button>
    </div>
</div>

<div class="modal" id="score-modal">
    <div class="glass-card modal-content">
        <i class="fa-solid fa-trophy" style="font-size: 3.5rem; color: #f59e0b; margin-bottom: 16px;"></i>
        <h2>Evaluation Finished!</h2>
        <p style="margin: 12px 0 24px 0; font-size: 1.2rem; color: var(--text-secondary);">
            Your Score: <span id="final-score" style="color: #fff; font-weight: 700;">0</span> / 3
        </p>
        <button class="quiz-nav-btn" id="submit-btn" onclick="window.location.reload()">Retry Assessment</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const questions = [
        {
            q: "Which constitutional amendment structure brought functional framework layout integration for local self governments (Panchayats)?",
            options: ["71st Constitutional Amendment", "73rd Constitutional Amendment", "74th Constitutional Amendment", "86th Constitutional Amendment"],
            correct: 1
        },
        {
            q: "The structural architecture of the 'Basic Structure Doctrine' emerged systematically through which legal landmark case standard?",
            options: ["Golaknath Case", "Minerva Mills Case", "Kesavananda Bharati Case", "Maneka Gandhi Case"],
            correct: 2
        },
        {
            q: "Which analytical matrix entity controls statutory framework operations for Monetary Policy target implementation setups inside India?",
            options: ["Finance Commission of India", "Reserve Bank of India", "Securities and Exchange Board of India", "NITI Aayog"],
            correct: 1
        }
    ];

    let currentIndex = 0;
    let userAnswers = new Array(questions.length).fill(null);

    function loadQuestion() {
        const current = questions[currentIndex];
        document.getElementById("progress-text").innerText = `Question ${currentIndex + 1} of ${questions.length}`;
        document.getElementById("question-text").innerText = current.q;
        
        const container = document.getElementById("options-container");
        container.innerHTML = "";
        
        current.options.forEach((opt, idx) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            if(userAnswers[currentIndex] === idx) btn.classList.add("selected");
            btn.innerText = opt;
            btn.onclick = () => selectOption(idx);
            container.appendChild(btn);
        });

        // Track state visibility logic
        document.getElementById("prev-btn").style.visibility = currentIndex === 0 ? "hidden" : "visible";
        if(currentIndex === questions.length - 1){
            document.getElementById("next-btn").style.display = "none";
            document.getElementById("submit-btn").style.display = "block";
        } else {
            document.getElementById("next-btn").style.display = "block";
            document.getElementById("submit-btn").style.display = "none";
        }
    }

    function selectOption(index) {
        userAnswers[currentIndex] = index;
        const buttons = document.querySelectorAll(".option-btn");
        buttons.forEach((b, i) => b.classList.toggle("selected", i === index));
    }

    function changeQuestion(step) {
        currentIndex += step;
        loadQuestion();
    }

    function evaluateQuiz() {
        let score = 0;
        userAnswers.forEach((ans, idx) => {
            if(ans === questions[idx].correct) score++;
        });
        document.getElementById("final-score").innerText = score;
        document.getElementById("score-modal").style.display = "flex";
    }

    // Initialize Question Suite context run
    loadQuestion();
</script>
{% endblock %}
