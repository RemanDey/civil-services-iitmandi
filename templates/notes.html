{% extends 'base.html' %}

{% block content %}
<style>
    .notes-section {
        margin-bottom: 50px;
    }
    .notes-section h3 {
        font-size: 1.6rem;
        font-weight: 800;
        border-left: 4px solid var(--accent);
        padding-left: 14px;
        margin-bottom: 24px;
        letter-spacing: 0.3px;
        text-shadow: 0 0 15px rgba(255, 91, 14, 0.15);
    }
    .notes-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 24px;
    }
    .note-card {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 24px;
    }
    .download-btn {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: white;
        padding: 10px 18px;
        border-radius: 10px;
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 700;
        letter-spacing: 0.3px;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
    }
    .download-btn:hover {
        background: var(--accent-gradient);
        border-color: rgba(255, 255, 255, 0.1);
        transform: translateY(-3px);
        box-shadow: 0 6px 18px var(--accent-glow);
    }
</style>

<h2 class="section-title">Knowledge & Study Repositories</h2>

{% for category, items in categories.items() %}
<div class="notes-section">
    <h3>{{ category }} Modules</h3>
    <div class="notes-grid">
        {% for item in items %}
        <div class="glass-card note-card">
            <div>
                <h4 style="font-weight: 600; margin-bottom: 4px;">{{ item.title }}</h4>
                <small style="color: var(--text-secondary);"><i class="fa-regular fa-file-pdf"></i> Format Variant: {{ item.type }}</small>
            </div>
            <a href="{{ item.download_link }}" class="download-btn"><i class="fa-solid fa-download"></i> Get</a>
        </div>
        {% endfor %}
    </div>
</div>
{% endfor %}
{% endblock %}
