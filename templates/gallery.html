{% extends 'base.html' %}

{% block content %}
<style>
    .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 24px;
    }
    .gallery-item {
        position: relative;
        border-radius: 16px;
        overflow: hidden;
        cursor: pointer;
        height: 240px;
        border: 1px solid var(--glass-border);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
    }
    .gallery-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
    }
    .gallery-overlay {
        position: absolute;
        inset: 0;
        background: rgba(5, 5, 8, 0.85);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.4s ease;
        padding: 20px;
        text-align: center;
        border: 1px solid rgba(255, 91, 14, 0.2);
        border-radius: 16px;
    }
    .gallery-item:hover {
        border-color: rgba(255, 91, 14, 0.4);
        box-shadow: 0 12px 30px rgba(255, 91, 14, 0.15);
        transform: translateY(-4px);
    }
    .gallery-item:hover .gallery-overlay { opacity: 1; }
    .gallery-item:hover img { transform: scale(1.08); }
    .gallery-overlay h4 {
        color: #fff;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-shadow: 0 0 15px rgba(255, 91, 14, 0.3);
    }

    /* Lightbox Modal CSS */
    .lightbox {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(3, 3, 5, 0.95);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        z-index: 2000;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
    }
    .lightbox img {
        max-width: 85%;
        max-height: 80vh;
        border-radius: 12px;
        border: 2px solid rgba(255, 91, 14, 0.3);
        box-shadow: 0 0 40px rgba(255, 91, 14, 0.3), 0 20px 50px rgba(0,0,0,0.8);
    }
    .lightbox-close {
        position: absolute;
        top: 30px;
        right: 40px;
        color: white;
        font-size: 2.8rem;
        cursor: pointer;
        transition: all 0.2s ease;
        width: 50px;
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .lightbox-close:hover {
        background: rgba(255, 91, 14, 0.15);
        color: var(--accent);
        border-color: rgba(255, 91, 14, 0.3);
    }
</style>

<h2 class="section-title">Club Moments Gallery</h2>

<div class="gallery-grid">
    {% for img in images %}
    <div class="gallery-item glass-card" onclick="openLightbox('{{ img.url }}')">
        <img src="{{ img.url }}" alt="{{ img.title }}">
        <div class="gallery-overlay">
            <h4 style="font-weight: 600;">{{ img.title }}</h4>
        </div>
    </div>
    {% endfor %}
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <span class="lightbox-close">&times;</span>
    <img id="lightbox-img" src="" alt="View Enlarged Container">
</div>

<script>
    function openLightbox(url) {
        document.getElementById('lightbox-img').src = url;
        document.getElementById('lightbox').style.display = 'flex';
    }
    function closeLightbox() {
        document.getElementById('lightbox').style.display = 'none';
    }
</script>
{% endblock %}
