{% extends 'base.html' %}

{% block content %}
<style>
    .feed-container {
        max-width: 850px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 28px;
    }
    .feed-meta {
        display: flex;
        gap: 18px;
        align-items: center;
        font-size: 0.85rem;
        color: var(--text-secondary);
        margin-bottom: 14px;
    }
    .cat-tag {
        background: rgba(255, 91, 14, 0.15);
        color: var(--accent);
        border: 1px solid rgba(255, 91, 14, 0.25);
        padding: 3px 12px;
        border-radius: 6px;
        font-weight: 700;
        text-transform: uppercase;
        font-size: 0.72rem;
        letter-spacing: 0.5px;
    }
    .readmore-link {
        color: var(--accent);
        text-decoration: none;
        font-weight: 700;
        font-size: 0.95rem;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 20px;
        transition: all 0.3s ease;
    }
    .readmore-link i {
        transition: transform 0.3s ease;
    }
    .readmore-link:hover {
        color: var(--accent-hover);
        text-decoration: none;
    }
    .readmore-link:hover i {
        transform: translateX(6px);
    }
</style>

<h2 class="section-title">Daily Current Affairs Analysis</h2>

<div class="feed-container">
    {% for feed in feeds %}
    <div class="glass-card">
        <div class="feed-meta">
            <span><i class="fa-regular fa-calendar"></i> {{ feed.date }}</span>
            <span class="cat-tag">{{ feed.category }}</span>
        </div>
        <h3 style="margin-bottom: 12px;">{{ feed.title }}</h3>
        <p style="color: var(--text-secondary); line-height: 1.6;">{{ feed.summary }}</p>
        <a href="#" class="readmore-link">Read Full Editorial Review <i class="fa-solid fa-arrow-right-long"></i></a>
    </div>
    {% endfor %}
</div>
{% endblock %}
